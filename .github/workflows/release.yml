name: release

# Tag a commit and the APK appears as a release asset, which is a plain HTTPS
# file the phone's browser installs in one tap. Deliberately not an artifact:
# upload-artifact produces an authenticated zip, which on Android means logging
# in, downloading, finding an extractor, and only then installing.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  # Build provenance is signed through Sigstore, which needs an OIDC token.
  id-token: write
  attestations: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # versionCode is the commit count, so the whole history is needed.
          # A shallow clone silently yields 1.
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          # No wrapper is committed; the version is pinned here and in the
          # Containerfile, and the two must be kept in step.
          gradle-version: '8.11.1'

      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.DOOBS_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::DOOBS_KEYSTORE_BASE64 is not set; the APK would be unsigned"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/doobs-release.jks"

      - name: Build
        env:
          DOOBS_STORE_FILE: ${{ runner.temp }}/doobs-release.jks
          DOOBS_STORE_PASSWORD: ${{ secrets.DOOBS_STORE_PASSWORD }}
          DOOBS_KEY_ALIAS: ${{ secrets.DOOBS_KEY_ALIAS }}
          DOOBS_KEY_PASSWORD: ${{ secrets.DOOBS_KEY_PASSWORD }}
        run: gradle --no-daemon test lint assembleRelease

      - name: Check it really is signed
        run: |
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)
          "$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk

      # The commit count is the single source of truth for the version, so the
      # asset is named from it and the tag is checked against it. Naming the
      # asset from the tag instead once published doobs-0.1.15.apk containing
      # 0.1.16, because the tag had been picked by hand from a stale count.
      - name: Name it after its version, and check the tag agrees
        id: name
        run: |
          version="0.1.$(git rev-list --count HEAD)"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME disagrees with the built version v$version"
            echo "::error::tag the commit with ./dev tag rather than by hand"
            exit 1
          fi
          cp app/build/outputs/apk/release/app-release.apk "doobs-$version.apk"
          echo "apk=doobs-$version.apk" >> "$GITHUB_OUTPUT"

      # Ties this exact APK digest to this repo, workflow and commit, so a
      # doobs-*.apk found anywhere can be proved to have come from the
      # published source. Nothing in the install path checks this — not
      # Obtainium, not Android — so it is provenance, not protection.
      #   gh attestation verify doobs-0.1.15.apk --repo BackSlasher/doobs
      - name: Attest provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ steps.name.outputs.apk }}

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" "${{ steps.name.outputs.apk }}" --generate-notes

      # A dispatch run has no tag to publish against, so keep the APK where the
      # run can at least be inspected.
      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: ${{ steps.name.outputs.apk }}
          path: ${{ steps.name.outputs.apk }}
